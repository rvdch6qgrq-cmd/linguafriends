name: Publish LinguaFriends app
on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/publish-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: webapp
        run: npm install --no-audit --no-fund
      - name: Build standalone mobile app
        working-directory: webapp
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build -- --base=/linguafriends/app/
      - name: Publish built app alongside existing demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/linguafriends-build
          cp -a webapp/dist/. /tmp/linguafriends-build/
          mkdir -p app
          cp -a /tmp/linguafriends-build/. app/
          git add app
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy real-chat app"
          git push origin HEAD:main
