name: Build LinguaFriends mobile app
on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --prefix webapp --no-audit --no-fund
      - name: Build site in /app
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build --prefix webapp -- --base=/linguafriends/app/ --outDir=../app --emptyOutDir
      - name: Commit static site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app
          if ! git diff --cached --quiet; then
            git commit -m "Publish LinguaFriends mobile web app"
            git push
          fi
